name: Update outage history and deploy Pages

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/Detroit"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - "scripts/**"
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dte-history-and-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest DTE observation
        run: python scripts/update_history.py

      - name: Commit new history point
        shell: bash
        run: |
          if git diff --quiet -- site/data/history.json; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json
          git commit -m "data: update DTE outage history"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
